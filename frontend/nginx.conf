server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    client_max_body_size 600k;
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
    }
    location /src/ { try_files $uri =404; }
    location / { try_files $uri $uri/ /index.html; }
}
