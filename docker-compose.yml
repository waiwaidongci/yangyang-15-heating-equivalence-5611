name: yangyang-15-heating-equivalence

x-python: &python
  build: ./backend
  environment:
    DATABASE_URL: postgresql+psycopg://desk:${DB_PASSWORD:-desk-local}@db/desk
    REDIS_URL: redis://redis:6379/0
    JWT_SECRET: ${JWT_SECRET:-yangyang-15-heating-equivalence-local-development-secret}
    SEED_DEMO: ${SEED_DEMO:-true}
  volumes:
    - reports:/artifacts
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  frontend:
    build: ./frontend
    container_name: ${COMPOSE_PROJECT_NAME:-yangyang-15-heating-equivalence}-frontend
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-18384}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: [CMD-SHELL, 'wget -q -O /dev/null http://127.0.0.1/api/health']
      interval: 2s
      timeout: 4s
      retries: 30
  backend:
    <<: *python
    container_name: ${COMPOSE_PROJECT_NAME:-yangyang-15-heating-equivalence}-backend
    ports:
      - "127.0.0.1:${BACKEND_PORT:-19384}:8000"
    healthcheck:
      test: [CMD, python, -c, "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/api/health', timeout=2)"]
      interval: 2s
      timeout: 4s
      retries: 45
  worker:
    <<: *python
    container_name: ${COMPOSE_PROJECT_NAME:-yangyang-15-heating-equivalence}-worker
    command: [python, -m, src.worker]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -m, src.worker, health]
      interval: 2s
      timeout: 4s
      retries: 45
  db:
    container_name: ${COMPOSE_PROJECT_NAME:-yangyang-15-heating-equivalence}-db
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: desk
      POSTGRES_USER: desk
      POSTGRES_PASSWORD: ${DB_PASSWORD:-desk-local}
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -U desk -d desk']
      interval: 2s
      timeout: 4s
      retries: 45
    ports:
      - "127.0.0.1:${DB_PORT:-17884}:5432"
    volumes:
      - database:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-yangyang-15-heating-equivalence}-redis
    volumes:
      - broker:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  database:
  broker:
  reports:

networks:
  default:
    ipam:
      config:
        - subnet: ${NETWORK_SUBNET:-10.234.144.0/24}
